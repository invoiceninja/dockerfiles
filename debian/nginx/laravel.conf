# https://laravel.com/docs/master/deployment#nginx
server {
    listen 80 default_server;
    server_name _;   
    root /var/www/html/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;
 
    charset utf-8;
 
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
 
    # The Flutter web app and the landing page's assets (invoiceninja/invoiceninja#13453). Their file names
    # carry no version, so the browser revalidates them. An add_header here replaces the server's, so the two
    # security headers are repeated.
    location ^~ /flutter/ {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        location ~ /\. { deny all; }
        try_files $uri =404;
    }

    location ^~ /landing/ {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        location ~ /\. { deny all; }
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
 
    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
